<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color" content="#f6f3ed" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23201C17'/%3E%3Crect x='14' y='14' width='36' height='13' rx='2' fill='%23F6F3ED'/%3E%3Cpath d='M14 41c6 0 6-6 12-6s6 6 12 6 6-6 12-6' stroke='%23CA4B20' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>图片拼接助手 · 在线长图拼接</title>
    <meta
      name="description"
      content="在浏览器里把多张图片拼成一张长图：纵向、横向、网格三种布局，可选波浪接缝，导出 PNG。图片只在本机处理，不上传服务器。"
    />
    <meta name="keywords" content="图片拼接, 长图拼接, 在线拼图, 照片拼接, 聊天记录拼接, image stitcher, photo joiner, combine images" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="图片拼接助手 · 在线长图拼接" />
    <meta property="og:description" content="纵向、横向、网格三种布局，可选波浪接缝，本地处理并导出 PNG。" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme =
            stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#13110f' : '#f6f3ed');

          const storedLocale = localStorage.getItem('locale');
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
          const zh = storedLocale === 'zh' || (storedLocale !== 'en' && languages.some((lang) => /^zh/i.test(lang || '')));
          document.documentElement.lang = zh ? 'zh-CN' : 'en';
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.lang = 'zh-CN';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>图片拼接助手需要启用 JavaScript 才能运行。 / Image Stitch requires JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
